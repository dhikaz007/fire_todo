name: Build APK Prod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"

      - name: Pub get
        run: flutter pub get

      - name: Build prod release APK
        run: flutter build apk --release --flavor prod --dart-define=FLAVOR=prod

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error
