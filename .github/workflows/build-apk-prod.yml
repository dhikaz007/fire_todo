name: Build APK Prod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK extras
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/cmake
          key: android-sdk-extras-${{ runner.os }}-${{ hashFiles('**/app/build.gradle') }}
          restore-keys: |
            android-sdk-extras-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Pub get
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.FIRE_TODO_KEYSTORE_BASE64 }}" | base64 -d > android/fire_todo.jks

      - name: Write key.properties
        run: |
          printf "storePassword=%s\nstoreFile=../fire_todo.jks\nkeyAlias=%s\nkeyPassword=%s\n" \
            "${{ secrets.FIRE_TODO_STORE_PASSWORD }}" \
            "${{ secrets.FIRE_TODO_KEY_ALIAS }}" \
            "${{ secrets.FIRE_TODO_KEY_PASSWORD }}" > android/key.properties

      - name: Build prod release APK
        run: flutter build apk --release --flavor prod --dart-define=FLAVOR=prod --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error
