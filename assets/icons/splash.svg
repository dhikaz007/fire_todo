<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1400" height="400" viewBox="0 0 1400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fire Todo Logo - Wordmark (No Checkmark)">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"></stop>
      <stop offset="100%" stop-color="#FF6B35"></stop>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.15"></feDropShadow>
    </filter>
  </defs>

  <!-- Flame icon inside rounded square -->
  <rect x="50" y="50" width="300" height="300" rx="70" fill="url(#fireGrad)" filter="url(#softShadow)"></rect>
  <path d="M200 110
           C230 150, 260 170, 260 220
           C260 280, 215 320, 200 335
           C185 320, 140 280, 140 220
           C140 170, 170 150, 200 110 Z" fill="#FFECE3"></path>
  <path d="M200 150
           C225 180, 245 195, 245 225
           C245 260, 220 285, 200 300
           C180 285, 155 260, 155 225
           C155 195, 175 180, 200 150 Z" fill="#FFD1BF"></path>

  <!-- App name -->
  <text x="400" y="230" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700" fill="#212121">Fire</text>
  <text x="720" y="230" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700" fill="#1E88E5">Todo</text>
</svg>
