allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
// subprojects {
//     project.buildDir = "${rootProject.buildDir}/${project.name}"
// }
// subprojects {
//     project.evaluationDependsOn(":app")
// }

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    afterEvaluate { subproject ->
        if (subproject.plugins.hasPlugin("com.android.application") ||
            subproject.plugins.hasPlugin("com.android.library")) {

            def androidExt = subproject.extensions.findByName("android")
            if (androidExt != null) {
                androidExt.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                if (!androidExt.hasProperty("namespace") || androidExt.namespace == null) {
                    if (subproject.name == "fk_user_agent") {
                        androidExt.namespace = "io.flutterfastkit.fk_user_agent"
                    } else if (subproject.name == "flutter_jailbreak_detection") {
                        androidExt.namespace = "com.btnsmartmobile.jailbreakdetection"
                    }
                }
            }
        }

        subproject.plugins.withId("org.jetbrains.kotlin.android") {
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            subproject.extensions.configure(org.jetbrains.kotlin.gradle.dsl.KotlinProjectExtension) { ext ->
                ext.jvmToolchain(17)
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
