org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=true
# New
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ========================
# CORE OPTIMIZATIONS
# ========================
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# CI: HTTP timeouts untuk avoid hang download dependency
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.http.socketTimeout=180000

# ========================
# BUILD PERFORMANCE
# ========================
# Non-transitive R class -> lebih cepat, avoid resolve semua resources
android.nonTransitiveRClass=true

# Kotlin incremental compilation
kotlin.incremental=true

# Kotlin daemon memory limit (hemat RAM jika banyak module)
kotlin.daemon.jvmargs=-Xmx2048m

# Jangan generate BuildConfig baru jika tidak berubah
android.defaults.buildfeatures.buildconfig=true

# Gradle configuration cache: DISABLED karena konflik dengan Flutter Gradle plugin
# org.gradle.configuration-cache=true

# ========================
# SDK DOWNLOAD CONTROL
# ========================
# Matikan auto-download SDK/NDK/CMake -> tampilkan error jika belum terinstall
android.builder.sdkDownload=false